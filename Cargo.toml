[package]
name = "pyvcloud"
version = "0.1.0"
edition = "2021"
authors = ["VMware Cloud Automation"]
description = "Rust-native client and CLI for interacting with VMware vCloud Director APIs."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/vmware/pyvcloud"

[lib]
name = "pyvcloud"
path = "src/lib.rs"

[[bin]]
name = "pyvcloud"
path = "src/bin/pyvcloud.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"

[dev-dependencies]
httpmock = "0.6"
